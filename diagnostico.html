<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Diagnóstico</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px 16px; font: 17px/1.5 -apple-system, system-ui, sans-serif; background: Canvas; color: CanvasText; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 8px 0; border-bottom: 1px solid GrayText; vertical-align: top; }
  td:last-child { text-align: right; font-weight: 600; padding-left: 16px; word-break: break-word; }
  p { color: GrayText; font-size: 15px; }
</style>
</head>
<body>
<h1>Diagnóstico de cordura.tech</h1>
<table id="t"></table>
<p>Gira el teléfono o desplaza la página: los valores se actualizan solos. Toma una captura de toda la tabla.</p>
<script>
  function mq(q) { return window.matchMedia ? (matchMedia(q).matches ? 'sí' : 'no') : 'sin matchMedia'; }
  var version = 'revisando…';
  fetch('/?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) { version = t.indexOf('function fijaAhora') >= 0 ? 'la última (con el arreglo)' : 'una anterior'; pinta(); }).catch(function () { version = 'no se pudo leer'; pinta(); });
  function pinta() {
    var calma = !!window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var filas = [
      ['Alto de la ventana (innerHeight)', innerHeight + ' px'],
      ['Ancho de la ventana (innerWidth)', innerWidth + ' px'],
      ['Alto visible (visualViewport)', window.visualViewport ? Math.round(visualViewport.height) + ' px' : 'no existe'],
      ['Pide movimiento reducido', mq('(prefers-reduced-motion: reduce)')],
      ['Sin preferencia de movimiento', mq('(prefers-reduced-motion: no-preference)')],
      ['Alto ≥ 30rem (pregunta antigua)', mq('(min-height: 30rem)')],
      ['Alto ≥ 480 px', mq('(min-height: 480px)')],
      ['Las escenas deberían fijarse', (!calma && innerHeight >= 480) ? 'sí' : 'no'],
      ['Versión publicada del sitio', version],
      ['Navegador', navigator.userAgent]
    ];
    document.getElementById('t').innerHTML = filas.map(function (f) { return '<tr><td>' + f[0] + '</td><td>' + f[1] + '</td></tr>'; }).join('');
  }
  pinta(); addEventListener('resize', pinta); addEventListener('scroll', pinta, { passive: true });
</script>
</body>
</html>
